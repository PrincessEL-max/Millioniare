<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Millionaire Tycoon 3D</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hud" class="tx"><span>💵 <b id="cash"></b></span><span>🐖 <b id="bank"></b></span></div>

    <button id="zoomIn" aria-label="Perbesar" title="Perbesar">+</button>

    <button id="zoomReset" aria-label="Atur ulang zoom" title="Atur ulang zoom">↺</button>
  </div>
  <div id="side"><div id="pt"></div><button id="bc" aria-label="Menu">💼</button><button id="ch" aria-label="Alat">🧰</button><button id="dice" aria-label="Lempar dadu"></button></div>
  <div id="ov"></div>
  <div id="street" class="tx"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
